version: 2

models:
  - name: int_addresses
    description: "Address enriched with city and country names."
    columns:
      - name: address_id
        data_tests: [unique, not_null]

  - name: int_film_categories
    description: "One row per film with a comma-separated category list."
    columns:
      - name: film_id
        data_tests: [unique, not_null]

  - name: int_customer_payments
    description: "Payment count and lifetime value per customer."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
