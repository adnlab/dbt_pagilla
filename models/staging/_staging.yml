version: 2

# ---------------------------------------------------------------------
# SOURCES — declare the raw tables so dbt can reference them safely and
# draw them into the DAG. Referenced as {{ source('raw', 'orders') }}.
# ---------------------------------------------------------------------
sources:
  - name: raw
    description: "Landing zone loaded by our (simulated) ingestion tool."
    schema: raw
    tables:
      - name: customers
      - name: orders
      - name: payments
      - name: events

# ---------------------------------------------------------------------
# MODELS — descriptions (feed the docs site) + generic tests (data quality)
# ---------------------------------------------------------------------
models:
  - name: stg_customers
    description: "One cleaned row per customer."
    columns:
      - name: customer_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null

  - name: stg_orders
    description: "One cleaned row per order."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Must point at a real customer."
        data_tests:
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'returned']

  - name: stg_payments
    description: "One row per payment, amount converted to dollars."
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: payment_method
        data_tests:
          - accepted_values:
              values: ['credit_card', 'bank_transfer', 'gift_card', 'coupon']
