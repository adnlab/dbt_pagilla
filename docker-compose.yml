services:
  postgres:
    image: postgres:16
    container_name: dbt_class_pg
    environment:
      POSTGRES_USER: dbt
      POSTGRES_PASSWORD: dbt
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Any .sql here runs once, on first boot, to seed the "raw" layer.
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: {}
