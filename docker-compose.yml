services:
  postgres:
    image: postgres:16
    container_name: dbt_class_pg
    environment:
      POSTGRES_USER: dbt
      POSTGRES_PASSWORD: dbt
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Any .sql here runs once, on first boot, to seed the "raw" layer.
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  # dbt Core itself, containerized. Not started by `docker compose up`
  # (it's behind a profile); you invoke it on demand with `docker compose run`.
  dbt:
    build: ./docker/dbt
    profiles: ["dbt"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DBT_PROFILES_DIR: /usr/app   # use the profiles.yml in the project
      DBT_HOST: postgres           # reach Postgres over the compose network
    volumes:
      - .:/usr/app                 # live-mount the project
    working_dir: /usr/app
    ports:
      - "8080:8080"                # for `dbt docs serve`

volumes:
  pgdata: {}
