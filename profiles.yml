# How dbt connects to the warehouse (the "keycard").
# host is env-driven so the SAME file works either way:
#   - inside the dbt container  -> DBT_HOST=postgres (compose sets this)
#   - from your host machine     -> defaults to localhost
dbt_class:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: 5432
      user: dbt
      password: dbt
      dbname: analytics
      schema: dev          # models land in analytics.dev.*
      threads: 4
